<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SForm Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
    th { background: #f4f4f4; }
    #status { margin-bottom: 12px; color: #555; }
  </style>
</head>
<body>
  <h1>SForm Dashboard</h1>
  <div id="status">กำลังโหลด...</div>
  <div id="out"></div>

  <script>
    const PROXY_URL = 'ใส่ Web app URL (/exec) ตรงนี้';

    fetch(PROXY_URL)
      .then(r => r.json())
      .then(data => {
        const rows = Array.isArray(data) ? data : (data.data || data.items || []);
        document.getElementById('status').textContent = `ได้ข้อมูล ${rows.length} รายการ`;
        if (!rows.length) {
          document.getElementById('out').textContent = JSON.stringify(data, null, 2);
          return;
        }
        const cols = Object.keys(rows[0]);
        document.getElementById('out').innerHTML =
          '<table><thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' +
          rows.slice(0, 50).map(r => '<tr>' + cols.map(c => `<td>${r[c] ?? ''}</td>`).join('') + '</tr>').join('') +
          '</tbody></table>';
      })
      .catch(err => {
        document.getElementById('status').textContent = 'โหลดไม่สำเร็จ: ' + err;
      });
  </script>
</body>
</html>
